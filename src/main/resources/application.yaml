spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/inquiry_triage
    username: dev
    password: dev1234
#  sql:
#    init:
#      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  # 정규화/검색/합성 3단계 모두 Claude(Anthropic) 하나만 사용합니다.
  ai:
    anthropic:
      api-key: ${CLAUDE_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
          temperature: 0.2
