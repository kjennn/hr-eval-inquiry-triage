spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/inquiry_triage
    username: dev
    password: dev1234
#  sql:
#    init:
#      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
    anthropic:
      api-key: ${CLAUDE_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
          temperature: 0.2

claude:
  api-key: ${CLAUDE_API_KEY}
  model: claude-sonnet-4-6
